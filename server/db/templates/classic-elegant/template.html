                0 4px 12px -4px rgba(0,0,0,.08);
  }

  /* Two-column layout matching the reference. The vertical divider lives in the
     background PNG, so we just position text into the same regions. */
  .card-grid{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns: 1fr 1fr;
  }

  /* LEFT — names block, vertically centered between the two floral sprays. */
  .names{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 0 4%;
  }
  .names .name{
    font-weight:600;
    font-size: clamp(22px, 5.2cqw, 60px);
    letter-spacing:.04em;
    line-height:1.1;
    text-transform:uppercase;
    margin:0;
    white-space:nowrap;
  }
  .names .and{
    font-family:"Pinyon Script", "Great Vibes", cursive;
    font-weight:400;
    font-size: clamp(20px, 4cqw, 46px);
    line-height:1.4;
    margin: .35em 0;
    text-transform:none;
    font-style: normal;
    display:block;
  }

  /* RIGHT — intro copy + date + location, evenly spaced. */
  .details{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 8% 8%;
    gap: clamp(14px, 3cqw, 36px);
  }
  .details p{
    margin:0;
    font-size: clamp(11px, 1.85cqw, 21px);
    letter-spacing:.12em;
    text-transform:uppercase;
    line-height:1.5;
  }
  .details .intro-2{ }
  .details .date{ letter-spacing:.18em; }
  .details .location{ letter-spacing:.18em; }

  /* Container queries so type scales with the card, not the viewport. */
  .card{ container-type: inline-size; }

  /* Mobile portrait: keep the landscape card and the floral background art,
     but shrink everything proportionally so the right-column copy fits inside
     the card at the constrained card height. The base styles use clamp()
     minimums tuned for desktop; here we drop those floors so type, spacing
     and padding scale all the way down with the card width. */
  @media (max-width: 600px){
    body{ padding:8px; }
    .names{ padding: 0 3%; }
    .names .name{ font-size: clamp(13px, 5.2cqw, 60px); }
    .names .and{ font-size: clamp(11px, 4cqw, 46px); }
    .details{ padding: 5% 6%; gap: clamp(4px, 3cqw, 36px); }
    .details p{ font-size: clamp(7px, 1.85cqw, 21px); line-height:1.35; }
  }

  @media print{
    body{background:#fff;padding:0;}
    .card{box-shadow:none;}
  }
</style>
</head>
<body>
  <article class="card" data-screen-label="Wedding Invitation">
    <div class="card-grid">
      <section class="names">
        <h1 class="name">{{coupleName1}}</h1>
        <span class="and">{{t:templates.and}}</span>
        <h1 class="name">{{coupleName2}}</h1>
      </section>

      <section class="details">
        <p class="intro-1">{{t:templates.together}}</p>
        <p class="intro-2 wording">{{wording}}</p>
        <p class="date">{{date}}</p>
        <p class="location">{{venue}}</p>
        <p class="venue-address">{{venueAddress}}</p>
        {{#if venueMapUrl}}
        <p class="venue-map"><a href="{{venueMapUrl}}" target="_blank" rel="noopener noreferrer">{{t:templates.viewOnMap}}</a></p>
        {{/if}}
        {{#if description}}
        <p class="description">{{description}}</p>
        {{/if}}
      </section>
    </div>
  </article>
</body>
</html>
